name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Public repo. A committed key is both a security incident and a
      # submission problem, so this gates everything else.
      - name: Scan for leaked API keys
        run: python scripts/check_secrets.py

      # Runs offline against the stand-in scorer -- no API key, no cost, so it
      # can gate every push.
      - name: Interview agent eval
        run: python -m eval.run_eval --all

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npx next build
        working-directory: web
